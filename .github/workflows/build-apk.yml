name: Build APK
on:
  push: { branches: [main] }
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        run: |
          export ANDROID_HOME=$HOME/android-sdk
          mkdir -p $ANDROID_HOME/cmdline-tools
          cd /tmp
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q commandlinetools-linux-*.zip
          mv cmdline-tools $ANDROID_HOME/cmdline-tools/latest
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV

      - name: Install packages
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Create missing resources
        run: |
          mkdir -p app/src/main/res/values
          cat > app/src/main/res/values/strings.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">FOV Assist</string>
          </resources>
          EOF

      - name: Fix manifest icon
        run: |
          sed -i 's|android:label="FOV Assist"|android:label="FOV Assist"\n        android:icon="@android:drawable/sym_def_app_icon"|' app/src/main/AndroidManifest.xml

      - name: Fix build.gradle
        run: |
          sed -i '/compileSdk 34/a\    buildToolsVersion "34.0.0"' app/build.gradle

      - name: Fix aapt2
        run: |
          chmod +x $ANDROID_HOME/build-tools/34.0.0/aapt2
          mkdir -p ~/.gradle
          echo "android.aapt2FromMavenOverride=$ANDROID_HOME/build-tools/34.0.0/aapt2" >> ~/.gradle/gradle.properties
          echo "org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8" >> ~/.gradle/gradle.properties

      - name: local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Gradlew exec
        run: chmod +x gradlew

      - name: Clean build
        run: ./gradlew clean --no-daemon

      - name: Build APK
        id: build_step
        run: |
          set -o pipefail
          ./gradlew assembleDebug --no-daemon --stacktrace --info 2>&1 | tee build.log
          echo "BUILD_EXIT=$?"

      - name: Find APK files
        if: always()
        run: |
          echo "=== Searching for APK files ==="
          find . -name "*.apk" -type f 2>/dev/null
          echo "=== End search ==="
          echo "=== Check standard paths ==="
          ls -la app/build/outputs/apk/debug/ 2>/dev/null || echo "debug dir not found"
          ls -la app/build/outputs/apk/ 2>/dev/null || echo "apk dir not found"
          ls -la app/build/outputs/ 2>/dev/null || echo "outputs dir not found"

      - name: Show build log tail
        if: always()
        run: |
          echo "=== Last 100 lines of build log ==="
          tail -100 build.log || true

      - name: Show errors
        if: failure()
        run: |
          echo "=== ERRORS ==="
          grep -B 2 -A 20 -i "FAILURE\|What went wrong\|Caused by\|error:\|Execution failed" build.log | head -200 || true

      - name: Upload any APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apk-files
          path: |
            app/build/outputs/apk/**/*.apk
            **/*.apk
          if-no-files-found: warn
          retention-days: 7
