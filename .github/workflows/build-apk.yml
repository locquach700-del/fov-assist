name: Build APK
on:
  push: { branches: [main] }
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        run: |
          export ANDROID_HOME=$HOME/android-sdk
          mkdir -p $ANDROID_HOME/cmdline-tools
          cd /tmp
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q commandlinetools-linux-*.zip
          mv cmdline-tools $ANDROID_HOME/cmdline-tools/latest
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV

      - name: Install packages
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Setup gradle.properties
        run: |
          cat > gradle.properties << 'EOF'
          android.useAndroidX=true
          android.enableJetifier=true
          android.nonTransitiveRClass=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          org.gradle.parallel=true
          org.gradle.caching=true
          kotlin.code.style=official
          android.aapt2FromMavenOverride=PLACEHOLDER
          EOF
          sed -i "s|PLACEHOLDER|$ANDROID_HOME/build-tools/34.0.0/aapt2|" gradle.properties
          chmod +x $ANDROID_HOME/build-tools/34.0.0/aapt2
          cat gradle.properties

      - name: local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Gradlew exec
        run: chmod +x gradlew

      - name: Clean
        run: ./gradlew clean --no-daemon

      - name: Build
        id: build
        run: |
          set -o pipefail
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Show errors
        if: failure()
        run: |
          echo "=== ERRORS ==="
          grep -B 2 -A 30 -i "FAILURE\|What went wrong\|Caused by\|error:\|Execution failed" build.log | head -200 || true

      - name: Find APK
        if: always()
        run: |
          find . -name "*.apk" -type f 2>/dev/null || echo "none"

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: app-debug
          path: |
            app/build/outputs/apk/**/*.apk
            **/*.apk
